# Environment component: the ONLY differences between local and aws live here.
# aws: pull from a registry (no local image loading) and use the 'regcred' pull secret.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ConfigMap, name: healthcare-config}
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: aws
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: regcred}]
