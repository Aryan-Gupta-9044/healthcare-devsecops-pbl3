# Only TCP/8080 may reach the pods. Enforced only if the CNI supports NetworkPolicy
# (Minikube: start with --cni=calico; k3s/Calico/Cilium: enforced).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: healthcare-allow-app-port-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
