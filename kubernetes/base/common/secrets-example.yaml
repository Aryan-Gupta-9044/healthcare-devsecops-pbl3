# EXAMPLE ONLY - not part of any kustomization. Never commit real values.
# Create the real secret from your shell instead:
#   kubectl -n healthcare create secret generic healthcare-secrets --from-literal=SECRET_KEY="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-secrets
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
