# Quick local run without Kubernetes:  docker compose up --build
services:
  healthcare:
    build: {context: ., args: {APP_VERSION: "1.0.0", DEPLOYMENT_COLOR: standard}}
    image: healthcare-app:1.0.0
    ports: ["8080:8080"]
    environment: {ENVIRONMENT: local}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  blue:
    profiles: [bluegreen]
    build: {context: ., args: {APP_VERSION: "1.0.0", DEPLOYMENT_COLOR: blue}}
    image: healthcare-app:1.0.0-blue
    ports: ["8081:8080"]
  green:
    profiles: [bluegreen]
    build: {context: ., args: {APP_VERSION: "2.0.0", DEPLOYMENT_COLOR: green}}
    image: healthcare-app:2.0.0-green
    ports: ["8082:8080"]
